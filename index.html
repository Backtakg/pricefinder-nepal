<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceFinder Nepal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛍️ PriceFinder Nepal</h1>
  <p>Find the best price for your product</p>
</header>

<main>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search for a product..."
    >

    <button onclick="searchProduct()">
      🔍 Search
    </button>
  </div>

  <section id="results">

    <h2>Search Results</h2>

    <div class="product">
      <div>
        <h3>Samsung Galaxy S25</h3>
        <p>256GB • 12GB RAM</p>
      </div>

      <strong>Rs. 109,999</strong>
    </div>

    <div class="product">
      <div>
        <h3>Samsung Galaxy S25</h3>
        <p>256GB • 12GB RAM</p>
      </div>

      <strong>Rs. 112,000</strong>
    </div>

    <div class="product best">
      <div>
        <span class="badge">🥇 BEST PRICE</span>
        <h3>Samsung Galaxy S25</h3>
        <p>256GB • 12GB RAM</p>
      </div>

      <strong>Rs. 109,500</strong>
    </div>

  </section>

</main>

<footer>
  <p>PriceFinder Nepal © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
