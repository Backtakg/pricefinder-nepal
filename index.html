<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceFinder Nepal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛍️ PriceFinder Nepal</h1>
  <p>Find the best price for your product</p>
  <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">
  🌙 Night Mode
</button>
</header>

<main>
<div class="categories">

  <button onclick="searchCategory('phone')">
    📱 Phones
  </button>

  <button onclick="searchCategory('laptop')">
    💻 Laptops
  </button>

  <button onclick="searchCategory('audio')">
    🎧 Audio
  </button>

  <button onclick="searchCategory('tv')">
    📺 TVs
  </button>

  <button onclick="searchCategory('electronics')">
    🏠 Electronics
  </button>

</div>
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search for a product..."
    >

    <button onclick="searchProduct()">
      🔍 Search
    </button>
  </div>

  <section id="results">

    <h2>Search Results</h2>

    <div class="product">
      <div>
        <h3>Samsung Galaxy S25</h3>
        <p>256GB • 12GB RAM</p>
      </div>

      <strong>Rs. 109,999</strong>
    </div>

    <div class="product">
      <div>
        <h3>Samsung Galaxy S25</h3>
        <p>256GB • 12GB RAM</p>
      </div>

      <strong>Rs. 112,000</strong>
    </div>

    <div class="product best">
      <div>
        <span class="badge">🥇 BEST PRICE</span>
        <h3>Samsung Galaxy S25</h3>
        <p>256GB • 12GB RAM</p>
      </div>

      <strong>Rs. 109,500</strong>
    </div>

  </section>

</main>

<footer>
  <p>PriceFinder Nepal © 2026</p>
</footer>

<script src="script.js"></script>
  <script>
  function toggleTheme() {

    document.body.classList.toggle("dark-mode");

    const button =
      document.getElementById("themeToggle");

    if (document.body.classList.contains("dark-mode")) {

      button.innerHTML = "☀️ Day Mode";

      localStorage.setItem("theme", "dark");

    } else {

      button.innerHTML = "🌙 Night Mode";

      localStorage.setItem("theme", "light");

    }
  }


  // Remember user's choice
  if (localStorage.getItem("theme") === "dark") {

    document.body.classList.add("dark-mode");

    document.getElementById("themeToggle").innerHTML =
      "☀️ Day Mode";
  }
</script>

</body>
</html>
